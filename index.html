<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<head>
<style>
  :root {
    --void-black: #050505;
    --limitless-blue: #00d4ff;
    --hollow-purple: #9d00ff;
    --glass-bg: rgba(255, 255, 255, 0.05);
  }

  body {
    margin: 0;
    background: var(--void-black);
    color: white;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  /* Background Effects */
  .bg-glow {
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #1a0033 0%, #000 70%);
    z-index: -1;
  }

  /* Centered Container */
  .container {
    text-align: center;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* Resized Profile Image */
  .profile-container {
    position: relative;
    width: 180px; /* Fixed Size */
    height: 180px; /* Fixed Size */
  }

  .profile-image {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Ensures any image fits perfectly without stretching */
    border-radius: 50%;
    border: 2px solid var(--limitless-blue);
    box-shadow: 0 0 20px var(--limitless-blue);
    animation: float 4s infinite ease-in-out;
  }

  /* Name Styling */
  h1 {
    font-size: 3.5rem;
    margin: 10px 0;
    letter-spacing: 8px;
    text-transform: uppercase;
    background: linear-gradient(to right, #fff, var(--limitless-blue), var(--hollow-purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Artistic Notice Board */
  .notice-board {
    width: 350px;
    padding: 20px;
    background: var(--glass-bg);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-left: 4px solid var(--hollow-purple);
    border-radius: 4px;
    position: relative;
    animation: slideUp 1s ease-out;
    box-shadow: 20px 20px 50px rgba(0,0,0,0.5);
  }

  .notice-board::before {
    content: 'NOTICE / 공지사항';
    position: absolute;
    top: -10px;
    left: 15px;
    font-size: 0.7rem;
    background: var(--hollow-purple);
    padding: 2px 10px;
    border-radius: 2px;
    letter-spacing: 2px;
  }

  .notice-text {
    font-weight: 300;
    letter-spacing: 1px;
    color: #ccc;
    line-height: 1.6;
  }

  /* Animations */
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Image Hover Effect */
  .profile-image:hover {
    filter: brightness(1.2) contrast(1.1);
    box-shadow: 0 0 40px var(--hollow-purple);
    transition: 0.4s ease;
  }
</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="container">
  <!-- Replace 'your-image-here.jpg' with your local file path or URL -->
  <div class="profile-container">
    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" alt="Profile" class="profile-image">
  </div>

  <h1>김고조</h1>

  <div class="notice-board">
    <div class="notice-text">
      여러분, 안녕히 주무세요! 좋은 꿈 꾸세요!
    </div>
  </div>
</div>

</body>
</html>
